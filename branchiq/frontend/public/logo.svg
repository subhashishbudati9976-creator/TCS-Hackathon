<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="logoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="logoAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1.5" />
    <g filter="url(#logoGlow)">
      <path d="M20 7L31 14V26L20 33L9 26V14L20 7Z" stroke="url(#logoPrimary)" stroke-width="2" fill="none" stroke-linejoin="round" opacity="0.85" />
      <line x1="20" y1="7" x2="20" y2="20" stroke="url(#logoAccent)" stroke-width="2" stroke-linecap="round" />
      <line x1="9" y1="26" x2="20" y2="20" stroke="url(#logoPrimary)" stroke-width="2" stroke-linecap="round" />
      <line x1="31" y1="26" x2="20" y2="20" stroke="url(#logoPrimary)" stroke-width="2" stroke-linecap="round" />
      <circle cx="20" cy="20" r="3.2" fill="url(#logoPrimary)" />
      <circle cx="20" cy="7" r="2" fill="#06B6D4" />
      <circle cx="31" cy="14" r="1.8" fill="#3B82F6" />
      <circle cx="9" cy="14" r="1.8" fill="#3B82F6" />
      <circle cx="31" cy="26" r="2.2" fill="#8B5CF6" />
      <circle cx="9" cy="26" r="2.2" fill="#10B981" />
      <circle cx="20" cy="33" r="2" fill="#10B981" />
    </g>
  </g>

  <!-- Typography -->
  <text x="54" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Branch<tspan fill="url(#logoPrimary)">IQ</tspan>
  </text>
  <text x="54" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.5">
    INTELLIGENT OPERATIONS
  </text>
</svg>
